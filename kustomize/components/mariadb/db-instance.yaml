apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: db-instance
spec:
  rootPasswordSecretKeyRef:
    name: db-secret
    key: root-password

  username: mediawiki
  passwordSecretKeyRef:
    name: db-secret
    key: password
    generate: true
  database: mediawiki

  port: 3306

  storage:
    size: 1Gi
    storageClassName: rook-ceph-block


  myCnf: |
    [mariadb]
    bind-address=*
    default_storage_engine=InnoDB
    binlog_format=row
    innodb_autoinc_lock_mode=2
    innodb_buffer_pool_size=1024M
    max_allowed_packet=256M

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 1Gi

  metrics:
    enabled: true