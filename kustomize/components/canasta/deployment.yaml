---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  selector:
    matchLabels:
      app: web
  replicas: 1
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/canastawiki/canasta:1.43-latest
          resources: {}
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: canasta-env
          volumeMounts:
            - mountPath: /var/www/mediawiki/w/user-extensions
              name: config-volume
              subPath: ./extensions
            - mountPath: /var/www/mediawiki/w/user-skins
              name: config-volume
              subPath: ./skins
            - mountPath: /mediawiki/config
              name: canasta-config
            - mountPath: /mediawiki/config/settings
              name: canasta-settings
            - mountPath: /mediawiki/images
              name: config-volume
              subPath: ./images
            - name: sitemap-data
              mountPath: /mediawiki/sitemap
      volumes:
        - name: canasta-config
          configMap:
            name: canasta-config
        - name: canasta-settings
          configMap:
            name: canasta-settings
        - name: config-volume
          persistentVolumeClaim:
            claimName: config-data
        - name: sitemap-data
          persistentVolumeClaim:
            claimName: sitemap-data
