apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ingress.yaml
- ../components/mariadb
- ../components/canasta


generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
# MARK - Generated by mkconfig.sh
- name: canasta-config
  files:
  - CanastaFooterIcon.php=config/CanastaFooterIcon.php
  - LocalSettings.php=config/LocalSettings.php
  - Vector.php=config/Vector.php
- name: canasta-settings
  files:
  - composer.local.json=settings/composer.local.json
# ENDMARK - Generated by mkconfig.sh
- name: canasta-env
  envs: 
  - environment

